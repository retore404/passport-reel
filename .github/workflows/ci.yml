# すべての PR で品質ゲートとビルドを検証する。
# Renovate の集約 PR はこのチェックの成功を条件に自動マージされる（renovate.json 参照）。
name: CI

on:
  pull_request:

permissions:
  contents: read

# 同じ PR への新しい push があれば、古い実行は結果が不要になるため取り消す。
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node.js の版数の正は mise.toml。CI に不要な開発 CLI（Claude Code など）は入れない。
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: node

      # pnpm の版数は package.json#packageManager から読み取られる。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm --filter ./apps/web build
